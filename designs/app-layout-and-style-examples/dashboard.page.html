<section class="dashboard-page">
  <header class="page-header">
    <h2>Dashboard</h2>
    <p>Overview of your inventory</p>
  </header>

  <section class="stats-grid" aria-label="Inventory summary cards">
    <article class="stat-card">
      <header>
        <h3>Storage Locations</h3>
        <span class="stat-icon location-icon" aria-hidden="true"></span>
      </header>
      <p class="stat-value">0</p>
      <p class="stat-caption">Active locations</p>
    </article>

    <article class="stat-card">
      <header>
        <h3>Available Items</h3>
        <span class="stat-icon available-icon" aria-hidden="true"></span>
      </header>
      <p class="stat-value available">0</p>
      <p class="stat-caption">Ready for use</p>
    </article>

    <article class="stat-card">
      <header>
        <h3>In Use at Events</h3>
        <span class="stat-icon in-use-icon" aria-hidden="true"></span>
      </header>
      <p class="stat-value in-use">0</p>
      <p class="stat-caption">Currently deployed</p>
    </article>

    <article class="stat-card">
      <header>
        <h3>Total Items</h3>
        <span class="stat-icon total-icon" aria-hidden="true"></span>
      </header>
      <p class="stat-value">0</p>
      <p class="stat-caption">No items available</p>
    </article>
  </section>

  <section class="updates-panel">
    <h3>Recent Updates</h3>
    <div class="updates-empty-state">
      <span class="empty-cube" aria-hidden="true"></span>
      <p>No inventory items yet</p>
      <button type="button">Add Your First Item</button>
    </div>
  </section>
</section>
